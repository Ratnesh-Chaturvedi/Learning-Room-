<svg xmlns="http://www.w3.org/2000/svg" viewBox="210 110 340 365" width="100%" height="100%">
  <defs>
    <!-- Soft Warm Glow Inside Doorway -->
    <radialGradient id="doorGlow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#FCE5DC" stop-opacity="0.78"/>
      <stop offset="65%" stop-color="#EEECFF" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#EEECFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Pencil Body Gradient -->
    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B3A6FD"/>
      <stop offset="50%" stop-color="#9A8BF6"/>
      <stop offset="100%" stop-color="#7F70E5"/>
    </linearGradient>

    <!-- Warm Orange Door Gradient -->
    <linearGradient id="doorWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDB157"/>
      <stop offset="100%" stop-color="#F29132"/>
    </linearGradient>

    <style>
      .ink-stroke {
        stroke: #1D1B38;
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ink-thin {
        stroke: #1D1B38;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ink-dashed {
        stroke: #1D1B38;
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 6 9;
        fill: none;
      }
    </style>
  </defs>

  <!-- 1. INTERIOR DOORWAY SOFT GLOW & FLOOR SHADOW (100% Transparent Outer BG) -->
  <path d="M 282 375 L 282 270 A 78 78 0 0 1 438 270 L 438 395 Z" fill="url(#doorGlow)" />
  <polygon points="315,392 435,392 435,418 320,418" fill="#E3DFEC" opacity="0.65" />

  <!-- 2. SHARED STUDY TABLE INSIDE THE ARCH -->
  <g id="study-table">
    <!-- Back & Front Table Legs -->
    <rect x="336" y="362" width="8" height="36" rx="3" fill="#D98B43" class="ink-thin" />
    <rect x="319" y="365" width="9" height="44" rx="3.5" fill="#E89D54" class="ink-thin" />
    <!-- Tabletop Perspective -->
    <polygon points="310,358 332,334 405,334 405,360" fill="#F6B26B" class="ink-thin" />
    <!-- Table Edge Thickness -->
    <rect x="310" y="358" width="95" height="9" rx="2" fill="#E09145" class="ink-thin" />
    <!-- Paper Sheet on Table -->
    <polygon points="348,352 355,341 384,341 388,352" fill="#FFFFFF" stroke="#1D1B38" stroke-width="2.4" stroke-linejoin="round" />
    <!-- Mini Pencil on Table -->
    <path d="M 330 351 L 340 341" stroke="#635BDB" stroke-width="4" stroke-linecap="round" />
    <path d="M 330 351 L 340 341" stroke="#1D1B38" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- 3. DASHED COLLABORATION LOOPS & SPARKLES -->
  <g id="magic-trails">
    <!-- Inner Arch Swirl -->
    <path d="M 362 325 C 350 295, 392 292, 376 268 C 362 248, 395 238, 412 252" class="ink-dashed" />
    <path d="M 382 324 C 392 308, 405 300, 416 298" class="ink-dashed" />

    <!-- Top Right Rising Loop Swirl -->
    <path d="M 424 208 C 435 190, 456 172, 434 156 C 414 142, 404 176, 436 178 C 464 180, 474 162, 488 152" class="ink-dashed" />

    <!-- Right Doorway Swirl -->
    <path d="M 480 185 C 504 185, 496 212, 480 202 C 466 194, 486 172, 514 168" class="ink-dashed" />
    <path d="M 476 292 C 512 285, 522 248, 492 232" class="ink-dashed" />

    <!-- 4-Point Sparkle Inside Arch -->
    <path d="M 345 245 Q 345 262 330 262 Q 345 262 345 279 Q 345 262 360 262 Q 345 262 345 245 Z" fill="#FDE08D" stroke="#E0A938" stroke-width="2" stroke-linejoin="round" />

    <!-- 4-Point Sparkle Top Right -->
    <path d="M 465 132 Q 465 150 448 150 Q 465 150 465 168 Q 465 150 482 150 Q 465 150 465 132 Z" fill="#FDE08D" stroke="#E0A938" stroke-width="2" stroke-linejoin="round" />

    <!-- 4-Point Sparkle Bold Outlined Right of Door -->
    <path d="M 495 232 Q 495 246 483 246 Q 495 246 495 260 Q 495 246 507 246 Q 495 246 495 232 Z" fill="#FFFDF7" class="ink-thin" />

    <!-- Small Lavender Diamond Sparkle Top -->
    <path d="M 405 145 Q 405 154 396 154 Q 405 154 405 163 Q 405 154 414 154 Q 405 154 405 145 Z" fill="#E2DCFF" stroke="#8C7AE6" stroke-width="2" stroke-linejoin="round" />

    <!-- Lavender 5-Point Stars -->
    <polygon points="330,295 333,302 341,303 335,308 337,316 330,312 323,316 325,308 319,303 327,302" fill="#B8A9F8" stroke="#7866D5" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="508,195 512,205 523,206 515,213 517,224 508,218 499,224 501,213 493,206 504,205" fill="#B8A9F8" stroke="#7866D5" stroke-width="2" stroke-linejoin="round" />
    <polygon points="502,145 505,152 512,153 507,158 508,165 502,161 496,165 497,158 492,153 499,152" fill="#B8A9F8" stroke="#7866D5" stroke-width="1.8" stroke-linejoin="round" />
  </g>

  <!-- 4. PURPLE PENCIL ARCHWAY -->
  <g id="pencil-arch">
    <!-- Main Curved Pencil Body -->
    <path d="M 248 392
             L 248 272
             A 106 106 0 0 1 452 232
             L 410 255
             A 58 58 0 0 0 296 272
             L 296 392
             Z"
          fill="url(#pencilGrad)" class="ink-stroke" />

    <!-- Pencil Facet Ridges (Hexagonal Pencil Lines following the Arch) -->
    <path d="M 263 390 L 263 272 A 91 91 0 0 1 436 239" fill="none" class="ink-thin" />
    <path d="M 280 390 L 280 272 A 74 74 0 0 1 420 247" fill="none" class="ink-thin" />

    <!-- Shaved Wood Cone at Left Base -->
    <path d="M 248 392
             Q 255 384 263 392
             Q 272 383 280 392
             Q 288 384 296 392
             L 272 442
             Z"
          fill="#F9DEC2" class="ink-stroke" />

    <!-- Wood Shading on Right Side of Cone -->
    <path d="M 280 392 Q 288 384 296 392 L 272 442 Z" fill="#E8C09B" />
    <path d="M 248 392 Q 255 384 263 392 Q 272 383 280 392 Q 288 384 296 392 L 272 442 Z" fill="none" class="ink-stroke" />

    <!-- Graphite Lead Tip -->
    <path d="M 263 423 Q 272 419 281 423 L 272 442 Z" fill="#1D1B38" class="ink-stroke" />
  </g>

  <!-- 5. WARM OPEN STUDIO DOOR (Right Pillar) -->
  <g id="open-door">
    <!-- Outer Door Frame / Side Depth -->
    <polygon points="455,212 468,214 468,448 455,450" fill="#E07D24" class="ink-stroke" />

    <!-- Main Door Leaf in Perspective -->
    <path d="M 396 270
             C 396 238, 422 216, 455 212
             L 455 450
             L 396 426
             Z"
          fill="url(#doorWood)" class="ink-stroke" />

    <!-- Upper Recessed Door Panel (Arched) -->
    <path d="M 407 274
             C 407 251, 424 235, 445 231
             L 445 316
             L 407 315
             Z"
          fill="#FCA856" class="ink-thin" />

    <!-- Lower Recessed Door Panel -->
    <polygon points="407,348 445,355 445,428 407,412" fill="#FCA856" class="ink-thin" />

    <!-- Oval Brass Door Handle -->
    <ellipse cx="445" cy="336" rx="4.8" ry="7.5" fill="#FDE08D" class="ink-thin" />
  </g>
</svg>


